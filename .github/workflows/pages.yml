name: Validate and deploy Publish site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate static site
        run: python3 scripts/validate_site.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce Academy global shell on every HTML document
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          current = 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.1'
          marker = 'data-skunkworks-global-nav="v10"'
          loader = f'<script defer src="{current}" {marker}></script>'
          old_tags = re.compile(r'<script\b[^>]*(?:academy-navigation\.js|data-skunkworks-global-nav|data-skunkworks-global-shell)[^>]*>\s*</script>', re.I)
          documents = []

          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              html = path.read_text(encoding='utf-8', errors='ignore')
              if not re.search(r'<!doctype\s+html|<html\b|<head\b|<body\b', html, re.I):
                  continue
              html = old_tags.sub('', html)
              if re.search(r'</head\s*>', html, re.I):
                  html = re.sub(r'</head\s*>', f'  {loader}\n</head>', html, count=1, flags=re.I)
              elif re.search(r'</body\s*>', html, re.I):
                  html = re.sub(r'</body\s*>', f'  {loader}\n</body>', html, count=1, flags=re.I)
              else:
                  raise SystemExit(f'Malformed HTML document cannot receive Academy shell: {path}')
              path.write_text(html, encoding='utf-8')
              documents.append(path)

          if not documents:
              raise SystemExit('Publish staging produced no HTML documents.')

          missing = []
          duplicate = []
          for path in documents:
              html = path.read_text(encoding='utf-8', errors='ignore')
              if current not in html or marker not in html:
                  missing.append(str(path))
              if html.count('academy-navigation.js') > 1:
                  duplicate.append(str(path))
          if missing:
              raise SystemExit('Global shell missing from: ' + ', '.join(missing))
          if duplicate:
              raise SystemExit('Duplicate global shell loaders in: ' + ', '.join(duplicate))
          print(f'Verified Academy canonical v10 shell on {len(documents)} Publish HTML document(s).')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
